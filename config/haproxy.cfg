#
# StealthL4Guard — HAProxy last-mile L4 sweeper.
#
# The bulk of attack traffic is filtered by XDP, TC/eBPF, and the
# rawguard nftables table before HAProxy ever sees it. HAProxy's
# role here is *not* defense; it is per-IP rate-limiting and
# distribution of the cleaned residue to the backend pool.
#
# Mode is TCP throughout. L7 inspection would re-introduce the
# fingerprintable surface this pipeline exists to avoid.
#
# Adjust `server` lines, stick-table sizes, and the rate thresholds
# for your environment before deploying.

global
    log         127.0.0.1 local0 info
    maxconn     200000
    nbthread    4

defaults
    mode                    tcp
    log                     global
    timeout connect         5s
    timeout client          30s
    timeout server          30s
    timeout client-fin      10s
    timeout server-fin      10s

# -----------------------------------------------------------------
# HTTP frontend (port 80)
# -----------------------------------------------------------------
frontend fe_http
    bind                    *:80
    default_backend         be_web

    stick-table type ip size 1m expire 10m \
        store conn_rate(10s),conn_cur,bytes_in_rate(10s)

    # Track every connecting IP.
    tcp-request connection track-sc0 src

    # Per-IP rate caps. These survive *after* the kernel pipeline
    # has done its work, so the legitimate-rate cap is intentionally
    # tight: anything that got through XDP+TC+nftables and still
    # exceeds these caps is either a slow-and-low attacker or a
    # misbehaving legitimate client.
    acl too_fast      sc_conn_rate(0)    gt 100
    acl too_many      sc_conn_cur(0)     gt 50

    tcp-request connection reject if too_fast
    tcp-request connection reject if too_many

# -----------------------------------------------------------------
# HTTPS frontend (port 443)
# -----------------------------------------------------------------
frontend fe_https
    bind                    *:443
    default_backend         be_web_tls

    stick-table type ip size 1m expire 10m \
        store conn_rate(10s),conn_cur

    tcp-request connection track-sc0 src

    acl too_fast      sc_conn_rate(0)    gt 80
    acl too_many      sc_conn_cur(0)     gt 40

    tcp-request connection reject if too_fast
    tcp-request connection reject if too_many

# -----------------------------------------------------------------
# Backends (placeholders — adapt to your topology)
# -----------------------------------------------------------------
backend be_web
    balance     roundrobin
    option      tcp-check
    server      web1 10.0.0.11:80  check inter 2s fall 3 rise 2
    server      web2 10.0.0.12:80  check inter 2s fall 3 rise 2

backend be_web_tls
    balance     roundrobin
    option      tcp-check
    server      web1 10.0.0.11:443 check inter 2s fall 3 rise 2
    server      web2 10.0.0.12:443 check inter 2s fall 3 rise 2

# Observability:
#   echo "show table fe_http" | socat stdio /var/run/haproxy.sock
