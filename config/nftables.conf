#!/usr/sbin/nft -f
#
# StealthL4Guard — pre-conntrack mark interpreter.
#
# This ruleset runs at priority -300 in the `prerouting` hook of
# the `raw` family, which is *before* conntrack creates state.
# Packets dropped here leave no trace in the connection table,
# minimize CPU work, and produce no feedback to the attacker.
#
# Marks are written by the TC/eBPF program (see bpf/tc_l4_guard.c):
#   0x01  MARK_GREY — suspicious flow → probabilistic drop
#   0x02  MARK_KILL — confirmed bad   → hard drop
#
# The set `bad_sources` is intentionally empty here; a user-space
# brain populates it at runtime (see README §"Tuning"):
#     nft add element inet rawguard bad_sources \
#         { 198.51.100.7 timeout 10m }

flush table inet rawguard

table inet rawguard {

    set bad_sources {
        type ipv4_addr
        flags timeout
        # entries are added at runtime by the user-space daemon
    }

    chain prerouting {
        type filter hook prerouting priority -300; policy accept;

        # Slow-banned sources — 80% drop.
        # Never 100%: a clean wall is a fingerprint.
        ip saddr @bad_sources meta random lt 80 counter drop

        # TC-eBPF KILL: hard drop with counter.
        meta mark 0x02 counter drop

        # TC-eBPF GREY: probabilistic drop (~30%).
        meta mark 0x01 meta random lt 30 counter drop

        # Only TCP / UDP / ICMP / ICMPv6 traffic survives this hook.
        # Everything else is silently dropped here, with no upstream
        # response and no conntrack state cost.
        ip protocol { tcp, udp, icmp } accept
        ip6 nexthdr { tcp, udp, icmpv6 } accept

        # Implicit drop for anything else — falls off the chain
        # without sending RST or ICMP, which is the whole point.
        counter drop
    }
}
